name: NSE Historical Scanner Backtest

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Number of completed signal sessions to test"
        required: true
        default: "20"
        type: choice
        options:
          - "10"
          - "20"
          - "40"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backtest dependencies
        run: python -m pip install --upgrade pip pandas "curl_cffi>=0.7,<1.0"

      - name: Download NSE archives and run backtest
        run: python scripts/backtest_scanner.py --sessions "${{ inputs.sessions }}" --calendar-days 90

      - name: Upload backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: nse-scanner-backtest-${{ github.run_number }}
          path: |
            backtest-output/
            backtest-data/raw/
          if-no-files-found: error
          retention-days: 30
