name: NSE Intraday Scanner Backtest V4

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Completed signal sessions"
        required: true
        default: "40"
        type: choice
        options:
          - "20"
          - "40"
      stop_loss:
        description: "Stop-loss percentage (target remains 1%)"
        required: true
        default: "0.5"
        type: choice
        options:
          - "0.5"
          - "0.75"
          - "1.0"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas "curl_cffi>=0.7,<1.0"
      - name: Build V3 daily shortlist
        run: python scripts/backtest_scanner_v3.py --sessions "${{ inputs.sessions }}" --calendar-days 180
      - name: Simulate 1% intraday target with stop-loss
        run: python scripts/backtest_scanner_v4.py --intraday-days 60 --stop-loss-pct "${{ inputs.stop_loss }}"
      - name: Upload V4 reports and V3 daily picks
        uses: actions/upload-artifact@v4
        with:
          name: nse-intraday-scanner-v4-${{ github.run_number }}
          path: |
            backtest-output-v4/
            backtest-output-v3/summary.json
            backtest-output-v3/top5_bullish_v3.csv
            backtest-output-v3/top5_bearish_v3.csv
          if-no-files-found: error
          retention-days: 30
