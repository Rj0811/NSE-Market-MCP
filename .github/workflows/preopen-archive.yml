name: NSE Pre-open Archive

on:
  workflow_dispatch:
  schedule:
    # 09:10 IST on weekdays. GitHub scheduled jobs can be delayed.
    - cron: "40 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-preopen-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependency
        run: python -m pip install "curl_cffi>=0.7,<1.0"

      - name: Download NSE pre-open snapshot
        run: python scripts/preopen_collector.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/preopen/
          if git diff --cached --quiet; then
            echo "No new pre-open snapshot to commit."
            exit 0
          fi
          git commit -m "data: archive NSE pre-open snapshot"
          git push
