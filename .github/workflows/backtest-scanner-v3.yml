name: NSE Historical Scanner Backtest V3

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Completed signal sessions to test"
        required: true
        default: "40"
        type: choice
        options:
          - "20"
          - "40"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas "curl_cffi>=0.7,<1.0"
      - name: Run V3 scanner and next-session range backtest
        run: python scripts/backtest_scanner_v3.py --sessions "${{ inputs.sessions }}" --calendar-days 180
      - name: Upload V3 reports and source data
        uses: actions/upload-artifact@v4
        with:
          name: nse-scanner-backtest-v3-${{ github.run_number }}
          path: |
            backtest-output-v3/
            backtest-data/raw/
          if-no-files-found: error
          retention-days: 30
